groups:
  - name: oengo-api-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oengo-api\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oengo-api instance is down\"
          description: \"Pod for oengo-api has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oengo-api\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oengo-api\"