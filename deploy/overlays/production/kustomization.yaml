apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oenexa-production

resources:
  - ../../base

namePrefix: prod-

patches:
  - target:
      kind: Deployment
      name: oengo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: NODE_ENV
            value: production
          - name: LOG_LEVEL
            value: info